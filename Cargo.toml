[package]
name = "rendrs"
version = "0.1.0"
edition = "2024"

[dependencies]
ethel = { path = "../ethel" }
janus = { path = "../janus", default-features = false, features = ["expose_gl", "textures"] }
paste = { version = "1.0.15", optional = true }
glam = { version = "=0.31.0", optional = true }
thiserror = "2.0.18"
tinyvec = "1.12.0"
tracing = "0.1.44"
indoc = { version = "2.0.7", optional = true }
image = { version = "0.25.10", optional = true }

[features]
default = ["framebuffer", "batching", "pipeline", "graphics", "geometry"]
pipeline = ["framebuffer", "dep:paste"]
framebuffer = []
glam = ["dep:glam"]
pack = ["dep:indoc"]
batching = []
graphics = ["dep:indoc", "dep:image", "dep:paste", "ethel/assets"]
geometry = ["pipeline", "pack"]
